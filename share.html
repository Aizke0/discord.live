<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Transmissor GoLive</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111214; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .box { background: #2b2d31; padding: 40px; border-radius: 15px; display: inline-block; }
        button { background: #5865f2; color: white; border: none; padding: 20px 40px; font-size: 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 20px; color: #23a55a; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>📺 Transmissor de Tela</h1>
        <p>Ao clicar abaixo, escolha a tela e volte para o Discord.</p>
        <button id="btnStart">🎥 INICIAR COMPARTILHAMENTO</button>
        <div id="status"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room'); // Pega o ID da sala vindo do Discord

        document.getElementById('btnStart').onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 30 },
                    audio: true
                });

                // Cria o Peer com o ID da sala (Ele é o DONO da sala)
                const peer = new Peer(roomId);

                peer.on('open', (id) => {
                    document.getElementById('status').innerText = "🔴 TRANSMITINDO AO VIVO!";
                    console.log("Sala aberta:", id);
                });

                // Quando alguém do Discord (ouvinte) ligar, envia o vídeo
                peer.on('call', (call) => {
                    call.answer(stream);
                });

                // Se fechar a aba, avisa
                stream.getVideoTracks()[0].onended = () => {
                    location.reload();
                };

            } catch (err) {
                alert("Erro: " + err.message);
            }
        };
    </script>
</body>
</html>
