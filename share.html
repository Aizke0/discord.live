<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel de Transmissão - GoLive</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { background: #111214; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #2b2d31; padding: 30px; border-radius: 12px; text-align: center; max-width: 480px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 10px; }
    p { color: #b5bac1; font-size: 14px; margin-bottom: 20px; }
    button { background: #5865f2; color: white; border: none; padding: 16px 32px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
    button:hover { background: #4752c4; }
    video { width: 100%; border-radius: 8px; margin-top: 20px; background: #000; }
    .status { color: #23a55a; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="box">
    <h2>📺 Transmissor de Tela</h2>
    <p>Sua tela será enviada para todos no seu canal do Discord!</p>
    
    <button id="startBtn">🎥 ESCOLHER TELA E TRANSMITIR</button>
    <div id="statusText" class="status"></div>

    <video id="preview" autoplay playsinline muted></video>
  </div>

  <script>
    // Pega o ID da sala pela URL (?room=...)
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'sala-geral';

    let peer;
    let localStream;

    document.getElementById('startBtn').onclick = async () => {
      try {
        // Como esta página roda em uma ABA REAL, o compartilhamento funciona 100%!
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 60 },
          audio: true
        });

        document.getElementById('preview').srcObject = localStream;
        document.getElementById('statusText').innerText = "🔴 TRANSMITINDO AO VIVO!";

        // Cria a conexão WebRTC com o ID da sala
        peer = new Peer(roomId);

        peer.on('open', (id) => {
          console.log('Transmissor online na sala:', id);
        });

        // Quando alguém do Discord entrar na sala, envia o vídeo para ele
        peer.on('call', (call) => {
          call.answer(localStream);
        });

      } catch (err) {
        alert("Erro ao selecionar tela: " + err.message);
      }
    };
  </script>
</body>
</html>
