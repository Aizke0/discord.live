<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Transmissor GoLive</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111214; color: white; font-family: sans-serif; text-align: center; padding: 40px; }
        .box { background: #2b2d31; padding: 30px; border-radius: 12px; display: inline-block; max-width: 400px; }
        button { background: #5865f2; color: white; border: none; padding: 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        #log { background: #000; color: #0f0; padding: 10px; margin-top: 20px; font-family: monospace; text-align: left; font-size: 12px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🚀 Transmissor</h2>
        <p>Clique abaixo, escolha a tela e mantenha esta aba aberta.</p>
        <button id="startBtn">INICIAR COMPARTILHAMENTO</button>
        <div id="log">Logs:<br></div>
    </div>

    <script>
        const log = (m) => document.getElementById('log').innerHTML += "> " + m + "<br>";
        const roomId = new URLSearchParams(window.location.search).get('room');

        document.getElementById('startBtn').onclick = async () => {
            try {
                log("Pedindo tela...");
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                log("✅ Tela capturada!");

                const peer = new Peer(roomId);

                peer.on('open', (id) => {
                    log("🔴 TRANSMITINDO NA SALA: " + id);
                });

                peer.on('call', (call) => {
                    log("Novo espectador conectado!");
                    call.answer(stream);
                });

                peer.on('error', (err) => {
                    log("Erro: " + err.type);
                    if(err.type === 'unavailable-id') alert("Erro: Esta sala já está ocupada!");
                });

            } catch (e) { log("Erro: " + e.message); }
        };
    </script>
</body>
</html>
