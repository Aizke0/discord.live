<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Transmissor</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111214; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        #log { background: #000; color: #0f0; padding: 10px; margin-top: 20px; font-family: monospace; }
        button { background: #5865f2; color: white; border: none; padding: 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🚀 Transmissor</h2>
    <button id="start">1. CAPTURAR TELA E TRANSMITIR</button>
    <div id="log">Logs aparecerão aqui...</div>

    <script>
        const log = (m) => document.getElementById('log').innerHTML += "> " + m + "<br>";
        const roomId = new URLSearchParams(window.location.search).get('room');

        document.getElementById('start').onclick = async () => {
            try {
                log("Pedindo tela...");
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                log("Tela capturada.");

                // O Transmissor PRECISA ter o ID da sala
                const peer = new Peer(roomId);

                peer.on('open', (id) => {
                    log("SALA CRIADA: " + id);
                    log("Agora volte ao Discord e aguarde o vídeo carregar.");
                });

                peer.on('call', (call) => {
                    log("Alguém conectou! Enviando vídeo...");
                    call.answer(stream);
                });

                peer.on('error', (err) => {
                    if(err.type === 'unavailable-id') {
                        log("ERRO: Alguém já está transmitindo nesta sala!");
                    } else {
                        log("Erro: " + err.type);
                    }
                });

            } catch (e) { log("Erro: " + e.message); }
        };
    </script>
</body>
</html>
