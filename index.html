<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste SDK</title>
    <!-- Import direto do CDN -->
    <script src="https://unpkg.com/@discord/embedded-app-sdk@1.1.0/dist/main.js"></script>
    <style>
        body { background: #2b2d31; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        #box { border: 2px solid #5865f2; display: inline-block; padding: 20px; border-radius: 10px; }
        .green { color: #23a55a; font-weight: bold; }
        .red { color: #f23f43; font-weight: bold; }
    </style>
</head>
<body>

    <div id="box">
        <h2>🔍 Teste de Conexão Discord</h2>
        <p id="status">Tentando conexão...</p>
        <p id="details"></p>
    </div>

    <script>
        const CLIENT_ID = "1541152251576451222";

        async function init() {
            const status = document.getElementById('status');
            const details = document.getElementById('details');

            // 1. Verifica se a biblioteca carregou
            if (typeof DiscordSDK === 'undefined') {
                status.innerHTML = '<span class="red">ERRO: Biblioteca SDK não carregou!</span>';
                return;
            }

            try {
                // 2. Tenta iniciar
                const discordSdk = new DiscordSDK.DiscordSDK(CLIENT_ID);
                
                status.innerText = "Aguardando resposta do Discord...";
                
                // Espera o Discord reconhecer o Iframe
                await discordSdk.ready();

                status.innerHTML = '<span class="green">✅ DISCORD RECONHECIDO!</span>';
                details.innerText = "Canal: " + discordSdk.channelId;

            } catch (err) {
                status.innerHTML = '<span class="red">❌ FALHA NO HANDSHAKE</span>';
                details.innerText = "Causa: " + err.message + "\n(Isso acontece se você abrir no navegador comum ou se o URL Mapping estiver errado)";
            }
        }

        // Tenta iniciar após 1 segundo para garantir carregamento
        setTimeout(init, 1000);
    </script>
</body>
</html>
