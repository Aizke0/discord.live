<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GoLive Viewer</title>
    <script src="https://unpkg.com/@discord/embedded-app-sdk@1.1.0/dist/main.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #1e1f22; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .btn { background: #23a55a; color: white; padding: 15px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        video { width: 100%; max-width: 720px; background: #000; border-radius: 8px; border: 2px solid #333; }
        #status { font-size: 12px; color: #aaa; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>🎬 Assistir Transmissão</h2>
    <div id="status">Iniciando...</div>
    
    <!-- Botão que chama a função do SDK -->
    <button id="btnOpen" class="btn">🌐 CLIQUE AQUI PARA TRANSMITIR</button>
    
    <br>
    <video id="remoteVideo" autoplay playsinline controls></video>

    <script>
        const CLIENT_ID = "1541152251576451222";
        const discordSdk = new DiscordSDK.DiscordSDK(CLIENT_ID);
        let roomId = "";

        async function start() {
            try {
                await discordSdk.ready();
                roomId = "room-" + discordSdk.channelId; // ID da sala baseado no canal
                document.getElementById('status').innerText = "Conectado à sala: " + discordSdk.channelId;

                // BOTÃO PARA ABRIR NO NAVEGADOR (Comando oficial do Discord)
                document.getElementById('btnOpen').onclick = () => {
                    const shareUrl = `${window.location.origin}/share.html?room=${roomId}`;
                    discordSdk.commands.openExternalLink({ url: shareUrl });
                };

                // ESCUTAR O VÍDEO
                const peer = new Peer(); // ID aleatório para quem assiste
                peer.on('open', (id) => {
                    console.log("Meu ID de ouvinte:", id);
                    
                    // Tenta conectar no transmissor a cada 3 segundos até ele aparecer
                    const connectLoop = setInterval(() => {
                        const call = peer.call(roomId, null);
                        if (call) {
                            call.on('stream', (stream) => {
                                document.getElementById('remoteVideo').srcObject = stream;
                                clearInterval(connectLoop);
                            });
                        }
                    }, 3000);
                });

            } catch (e) {
                document.getElementById('status').innerText = "Erro ou fora do Discord.";
            }
        }
        start();
    </script>
</body>
</html>
