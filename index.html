<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GoLive Fix</title>
    <style>
        body { background: #1e1f22; color: white; font-family: sans-serif; text-align: center; }
        video { width: 90%; background: #000; border-radius: 8px; margin-top: 20px; }
        button { background: #5865f2; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>🎬 Teste de Tela</h2>
    <button id="btn">CLIQUE PARA TRANSMITIR</button>
    <br>
    <video id="v" autoplay playsinline></video>

    <script>
        document.getElementById('btn').onclick = async () => {
            try {
                // O segredo está aqui: o navegador precisa dessa chamada direta
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: true, 
                    audio: true 
                });
                document.getElementById('v').srcObject = stream;
            } catch (e) {
                alert("Erro: " + e.message);
                console.error(e);
            }
        };
    </script>
</body>
</html>
