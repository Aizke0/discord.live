<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoLive Discord</title>
  <script src="https://unpkg.com/@discord/embedded-app-sdk@1.1.0/dist/main.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1f22; color: #dbdee1; font-family: sans-serif; text-align: center; padding: 20px; }
    .card { background: #2b2d31; padding: 24px; border-radius: 12px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 8px; color: #fff; }
    p { font-size: 14px; color: #949ba4; margin-bottom: 20px; }
    
    .btn-external {
      display: inline-block;
      background: #23a55a;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .btn-external:hover { background: #1f924e; }
    
    .video-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #111214;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #383a40;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎬 GoLive Stream</h2>
    <p id="status">Conectando ao Discord...</p>

    <!-- Este link abre em uma nova aba REAL do navegador -->
    <a id="btnTransmitir" href="#" target="_blank" class="btn-external">
      🌐 CLIQUE AQUI PARA TRANSMITIR SUA TELA
    </a>

    <div class="video-container">
      <video id="remoteVideo" autoplay playsinline controls></video>
    </div>
  </div>

  <script>
    const CLIENT_ID = "1541152251576451222";
    const discordSdk = new DiscordSDK.DiscordSDK(CLIENT_ID);
    let channelId = "sala-geral";

    async function init() {
      try {
        await discordSdk.ready();
        channelId = discordSdk.channelId || "sala-geral";
        document.getElementById('status').innerText = "✅ Conectado! Sala: " + channelId;
      } catch (e) {
        document.getElementById('status').innerText = "🌐 Modo Web Ativo";
      }

      // Cria o link para a página de transmissão externa
      const shareUrl = `${window.location.origin}/share.html?room=${channelId}`;
      document.getElementById('btnTransmitir').href = shareUrl;

      // Inicia o recebedor de vídeo
      const peer = new Peer("viewer-" + Math.floor(Math.random() * 1000));
      
      peer.on('open', () => {
        // Tenta conectar no transmissor da sala
        const call = peer.call(channelId, null);
        if(call) {
          call.on('stream', (stream) => {
            document.getElementById('remoteVideo').srcObject = stream;
          });
        }
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (stream) => {
          document.getElementById('remoteVideo').srcObject = stream;
        });
      });
    }

    init();
  </script>
</body>
</html>
