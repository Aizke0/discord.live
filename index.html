<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GoLive Bot</title>
    <script src="https://unpkg.com/@discord/embedded-app-sdk@1.1.0/dist/main.js"></script>
    <style>
        body { background: #313338; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .card { background: #2b2d31; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button { background: #5865f2; color: white; border: none; padding: 15px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin: 10px; }
        button:hover { background: #4752c4; }
        video { width: 100%; max-width: 600px; background: #000; border-radius: 8px; margin-top: 20px; border: 2px solid #4e5058; }
        #status { font-size: 14px; color: #b5bac1; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 Transmissão de Tela</h2>
        <div id="status">Aguardando autorização do Discord...</div>
        
        <!-- Botão que vai pedir a tela -->
        <button id="btnShare">📺 TRANSMITIR TELA</button>
        
        <br>
        <video id="videoPreview" autoplay playsinline controls></video>
    </div>

    <script>
        const CLIENT_ID = "1541152251576451222";
        const discordSdk = new DiscordSDK.DiscordSDK(CLIENT_ID);
        const btn = document.getElementById('btnShare');
        const status = document.getElementById('status');

        async function setup() {
            try {
                // 1. Inicia o SDK
                await discordSdk.ready();
                
                // 2. PEDE AUTORIZAÇÃO (Aparece aquela janelinha oficial do Discord)
                const auth = await discordSdk.commands.authorize({
                    client_id: CLIENT_ID,
                    response_type: "code",
                    state: "",
                    prompt: "none",
                    scope: ["identify", "guilds", "rpc.activities.write.protocol"],
                });

                status.innerText = "✅ Bot Autorizado! Clique no botão abaixo.";
                status.style.color = "#23a55a";
            } catch (e) {
                status.innerText = "⚠️ Rodando em modo navegador (Sem SDK).";
            }
        }

        // AÇÃO DO BOTÃO
        btn.onclick = async () => {
            try {
                // Tenta capturar a tela diretamente na mesma janela
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });

                document.getElementById('videoPreview').srcObject = stream;
                status.innerText = "🎥 Transmitindo agora!";
            } catch (err) {
                console.error(err);
                alert("Erro ao capturar tela: " + err.message + "\n\nCertifique-se de estar usando o Discord pelo NAVEGADOR Chrome.");
            }
        };

        setup();
    </script>
</body>
</html>
