<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoLive Teste</title>
    <script src="https://unpkg.com/@discord/embedded-app-sdk@1.1.0/dist/main.js"></script>
    <style>
        body { background: #313338; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 600px; background: black; border-radius: 8px; margin-top: 20px; }
        button { background: #5865f2; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 18px; }
        #log { color: #ffaa00; font-size: 12px; margin-top: 10px; border: 1px solid #555; padding: 10px; text-align: left; overflow-y: auto; max-height: 100px; }
    </style>
</head>
<body>

    <h2>🎬 Teste de Transmissão</h2>
    <div id="status">Verificando SDK...</div>
    <div id="log">Logs: <br></div>

    <button id="btnShare">🚀 TRANSMITIR TELA</button>
    <br>
    <video id="meuVideo" autoplay playsinline></video>

    <script>
        const CLIENT_ID = "1541152251576451222"; // <-- COLOQUE SEU ID AQUI
        const logElement = document.getElementById('log');
        
        function addLog(msg) {
            logElement.innerHTML += "> " + msg + "<br>";
            console.log(msg);
        }

        // 1. Iniciar o SDK do Discord
        const discordSdk = new DiscordSDK.DiscordSDK(CLIENT_ID);

        async function initDiscord() {
            try {
                addLog("Tentando conectar ao Discord...");
                await discordSdk.ready();
                addLog("Conectado ao Discord com sucesso!");
                document.getElementById('status').innerText = "✅ Online no Discord";
            } catch (e) {
                addLog("Erro SDK: " + e.message);
                document.getElementById('status').innerText = "❌ Erro ao carregar SDK";
            }
        }

        // 2. Lógica do Botão
        document.getElementById('btnShare').addEventListener('click', async () => {
            addLog("Botão clicado. Pedindo permissão de tela...");
            
            try {
                // Tenta capturar a tela
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

                addLog("Permissão concedida! Mostrando vídeo...");
                const video = document.getElementById('meuVideo');
                video.srcObject = stream;

            } catch (err) {
                addLog("ERRO AO TRANSMITIR: " + err.name + " - " + err.message);
                alert("Erro: " + err.message);
            }
        });

        initDiscord();
    </script>
</body>
</html>
